name: Build and test

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '19'
          cache: sbt
      - name: Set up SBT
        uses: sbt/setup-sbt@v1
      - name: Build project
        id: build
        run: sbt --batch clean compile
      - name: Run tests
        run: sbt --batch test
